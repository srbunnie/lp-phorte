GRADUAÇÃO PHORTE 2027 — CARROSSEL PARA ELEMENTOR
1. Insira um widget HTML em um contêiner com largura total (100%).
2. Zere o padding e a margem do contêiner e do widget nos três dispositivos.
3. Cole TODO o conteúdo deste arquivo no campo Código HTML do widget.
O carrossel avança automaticamente a cada 5 segundos e oferece setas, indicadores, pausa, teclado e toque.
A rotação começa pausada com preferência por movimento reduzido e para quando a pessoa navega por teclado.
O CTA direciona para https://faculdadephorte.edu.br/graduacao/. O segundo slide exibe a arte Dia dos Professores 2026.

Poppins e os SVGs de papel estão incorporados; as demais imagens usam a biblioteca do WordPress.
Use uma única instância deste banner por página.

<script>
(() => {
  const carousels = document.querySelectorAll('[data-carousel]');

  carousels.forEach((carousel, carouselIndex) => {
    if (carousel.dataset.carouselReady === 'true') return;

    const slides = Array.from(carousel.querySelectorAll('[data-carousel-slide]'));
    const track = carousel.querySelector('[data-carousel-track]');
    const controls = carousel.querySelector('[data-carousel-controls]');
    const pagination = carousel.querySelector('[data-carousel-pagination]');
    const previousButton = carousel.querySelector('[data-carousel-previous]');
    const nextButton = carousel.querySelector('[data-carousel-next]');
    const rotationButton = carousel.querySelector('[data-carousel-rotation]');
    const status = carousel.querySelector('[data-carousel-status]');

    if (slides.length < 2 || !track || !controls || !pagination || !previousButton || !nextButton || !rotationButton) {
      if (controls) controls.hidden = true;
      return;
    }

    carousel.dataset.carouselReady = 'true';
    if (!carousel.id) {
      let candidate = `phorte-carousel-${carouselIndex + 1}`;
      let suffix = 1;
      while (document.getElementById(candidate)) {
        suffix += 1;
        candidate = `phorte-carousel-${carouselIndex + 1}-${suffix}`;
      }
      carousel.id = candidate;
    }

    let activeIndex = Math.max(0, slides.findIndex((slide) => slide.dataset.active === 'true'));
    const motionPreference = window.matchMedia('(prefers-reduced-motion: reduce)');
    let rotationEnabled = !motionPreference.matches;
    let pointerPaused = false;
    let timerId = 0;
    let resizeFrame = 0;

    const updateTrackHeight = () => {
      window.cancelAnimationFrame(resizeFrame);
      resizeFrame = window.requestAnimationFrame(() => {
        track.style.height = `${slides[activeIndex].offsetHeight}px`;
      });
    };
    const trackResizeObserver = typeof ResizeObserver === 'undefined'
      ? null
      : new ResizeObserver(updateTrackHeight);

    const stopTimer = () => {
      if (timerId) window.clearTimeout(timerId);
      timerId = 0;
    };

    const updateRotationControl = () => {
      rotationButton.setAttribute('aria-pressed', String(rotationEnabled));
      rotationButton.setAttribute(
        'aria-label',
        rotationEnabled ? 'Pausar troca automática' : 'Ativar troca automática',
      );
    };

    const render = (announceChange = false) => {
      slides.forEach((slide, index) => {
        const isActive = index === activeIndex;
        slide.dataset.active = String(isActive);
        slide.setAttribute('aria-hidden', String(!isActive));
        slide.setAttribute('aria-label', `Destaque ${index + 1} de ${slides.length}`);
        slide.toggleAttribute('inert', !isActive);
      });
      updateTrackHeight();
      if (trackResizeObserver) {
        trackResizeObserver.disconnect();
        trackResizeObserver.observe(slides[activeIndex]);
      }

      Array.from(pagination.children).forEach((dot, index) => {
        const isActive = index === activeIndex;
        dot.setAttribute('aria-current', String(isActive));
        dot.setAttribute('aria-label', `Exibir destaque ${index + 1} de ${slides.length}`);
      });

      if (announceChange && status) {
        status.textContent = `Destaque ${activeIndex + 1} de ${slides.length}`;
      }
    };

    const scheduleNext = () => {
      stopTimer();
      const shouldRun = rotationEnabled && !pointerPaused && !document.hidden;
      carousel.dataset.rotationRunning = String(shouldRun);
      if (!shouldRun) return;

      const activeDot = pagination.children[activeIndex];
      if (activeDot) {
        activeDot.classList.remove('is-progressing');
        void activeDot.offsetWidth;
        activeDot.classList.add('is-progressing');
      }

      timerId = window.setTimeout(() => {
        activeIndex = (activeIndex + 1) % slides.length;
        render();
        scheduleNext();
      }, 5000);
    };

    const showSlide = (nextIndex, isManual = true) => {
      activeIndex = (nextIndex + slides.length) % slides.length;
      if (isManual) {
        rotationEnabled = false;
        updateRotationControl();
        pagination.querySelectorAll('.is-progressing').forEach((dot) => {
          dot.classList.remove('is-progressing');
        });
      }
      render(isManual);
      scheduleNext();
    };

    const handleMotionPreference = (event) => {
      if (!event.matches) return;
      rotationEnabled = false;
      updateRotationControl();
      scheduleNext();
    };
    if (motionPreference.addEventListener) {
      motionPreference.addEventListener('change', handleMotionPreference);
    } else if (motionPreference.addListener) {
      motionPreference.addListener(handleMotionPreference);
    }

    slides.forEach((_, index) => {
      const dot = document.createElement('button');
      dot.className = 'phorte-carousel__dot';
      dot.type = 'button';
      dot.setAttribute('aria-controls', carousel.id);
      dot.setAttribute('aria-label', `Exibir destaque ${index + 1} de ${slides.length}`);
      const progress = document.createElement('span');
      progress.className = 'phorte-carousel__progress';
      progress.setAttribute('aria-hidden', 'true');
      dot.append(progress);
      dot.addEventListener('click', () => showSlide(index));
      pagination.append(dot);
    });

    previousButton.addEventListener('click', () => showSlide(activeIndex - 1));
    nextButton.addEventListener('click', () => showSlide(activeIndex + 1));
    rotationButton.addEventListener('click', () => {
      rotationEnabled = !rotationEnabled;
      updateRotationControl();
      scheduleNext();
    });

    carousel.addEventListener('pointerenter', () => {
      pointerPaused = true;
      scheduleNext();
    });
    carousel.addEventListener('pointerleave', () => {
      pointerPaused = false;
      scheduleNext();
    });
    carousel.addEventListener('focusin', () => {
      if (!rotationEnabled) return;
      rotationEnabled = false;
      updateRotationControl();
      scheduleNext();
    });
    carousel.addEventListener('keydown', (event) => {
      if (event.altKey || event.ctrlKey || event.metaKey) return;
      if (event.key === 'ArrowLeft') {
        event.preventDefault();
        showSlide(activeIndex - 1);
      } else if (event.key === 'ArrowRight') {
        event.preventDefault();
        showSlide(activeIndex + 1);
      }
    });

    let touchStart = null;
    carousel.addEventListener('pointerdown', (event) => {
      if (event.pointerType === 'mouse' || event.target.closest('button, a')) return;
      touchStart = { x: event.clientX, y: event.clientY };
    });
    carousel.addEventListener('pointerup', (event) => {
      if (!touchStart) return;
      const deltaX = event.clientX - touchStart.x;
      const deltaY = event.clientY - touchStart.y;
      touchStart = null;
      if (Math.abs(deltaX) < 52 || Math.abs(deltaX) < Math.abs(deltaY)) return;
      showSlide(activeIndex + (deltaX < 0 ? 1 : -1));
    });
    carousel.addEventListener('pointercancel', () => { touchStart = null; });

    document.addEventListener('visibilitychange', scheduleNext);
    window.addEventListener('resize', updateTrackHeight, { passive: true });
    slides.flatMap((slide) => Array.from(slide.querySelectorAll('img'))).forEach((image) => {
      image.addEventListener('load', updateTrackHeight);
    });
    if (document.fonts && document.fonts.ready) {
      document.fonts.ready.then(updateTrackHeight);
    }
    controls.hidden = false;
    updateRotationControl();
    render();
    scheduleNext();
  });
})();

</script>
