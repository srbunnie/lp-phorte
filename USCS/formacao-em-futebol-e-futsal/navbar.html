<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Navbar - Faculdade Phorte</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      background: #0a0a0a;
      overflow-x: hidden;
    }

    body {
      padding-top: 120px;
    }

    .phorte-navbar,
    .phorte-navbar * {
      box-sizing: border-box;
    }

    .phorte-navbar {
      --phorte-black: #0a0a0a;
      --phorte-white: #fafaf8;
      --phorte-red: #c8102e;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 1000;
      width: 100%;
      min-height: 120px;
      background: var(--phorte-black);
      color: var(--phorte-white);
      font-family: 'Barlow Condensed', sans-serif;
    }

    .phorte-navbar__inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 32px;
      width: 100%;
      max-width: 1280px;
      min-height: 120px;
      margin: 0 auto;
      padding: 20px 32px;
    }

    .phorte-navbar__logo {
      display: block;
      width: 120px;
      height: auto;
      filter: grayscale(1) brightness(0) invert(1);
    }

    .phorte-navbar__links {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: clamp(16px, 2.5vw, 38px);
      margin-left: auto;
    }

    .phorte-navbar__links a,
    .phorte-navbar__button {
      color: inherit;
      font-size: 17px;
      font-weight: 700;
      text-decoration: none;
      text-transform: uppercase;
    }

    .phorte-navbar__button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 54px;
      padding: 0 28px;
      background: var(--phorte-red);
    }

    .phorte-navbar__toggle {
      display: none;
      width: 42px;
      height: 42px;
      border: 1px solid rgba(250,250,248,.45);
      background: transparent;
      cursor: pointer;
    }

    .phorte-navbar__toggle span {
      display: block;
      width: 20px;
      height: 2px;
      margin: 4px auto;
      background: var(--phorte-white);
    }

    @media (max-width: 800px) {
      .phorte-navbar,
      .phorte-navbar__inner {
        min-height: 96px;
      }

      body {
        padding-top: 96px;
      }

      .phorte-navbar__inner {
        gap: 10px;
        padding: 16px;
      }

      .phorte-navbar__links {
        display: none;
      }

      .phorte-navbar__button {
        margin-left: auto;
        min-height: 50px;
        padding: 0 15px;
        font-size: 16px;
        white-space: nowrap;
      }

      .phorte-navbar__toggle {
        display: block;
        flex: 0 0 42px;
      }
    }

    @media (max-width: 480px) {
      body {
        padding-top: 88px;
      }

      .phorte-navbar,
      .phorte-navbar__inner {
        min-height: 88px;
      }

      .phorte-navbar__inner {
        padding: 14px 12px;
      }

      .phorte-navbar__logo {
        width: 92px;
      }

      .phorte-navbar__button {
        min-height: 46px;
        padding: 0 12px;
        font-size: 15px;
      }

      .phorte-navbar__toggle {
        width: 38px;
        height: 38px;
        flex-basis: 38px;
      }
    }
  </style>
</head>
<body>
  <nav class="phorte-navbar" aria-label="Navegação principal">
    <div class="phorte-navbar__inner">
      <a href="#hero" aria-label="Faculdade Phorte">
        <img class="phorte-navbar__logo" src="https://posphorte.com.br/wp-content/uploads/2024/05/Logo_Faculdade_Phorte-300x150.png" alt="Faculdade Phorte">
      </a>

      <div class="phorte-navbar__links">
        <a href="#hero">Início</a>
        <a href="#importancia">O que é</a>
        <a href="#professor">Professor</a>
        <a href="#aprendizados">Aprendizados</a>
        <a href="#programa">Programa</a>
        <a href="#certificado">Certificado</a>
        <a href="#faq">Dúvidas</a>
      </div>

      <a class="phorte-navbar__button" href="#inscricao">Inscrever-se</a>
      <button class="phorte-navbar__toggle" type="button" aria-label="Abrir menu">
        <span></span>
        <span></span>
        <span></span>
      </button>
    </div>
  </nav>
</body>
</html>
