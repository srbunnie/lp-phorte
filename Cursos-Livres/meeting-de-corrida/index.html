<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta
      name="description"
      content="Em breve divulgaremos novas datas para o Meeting de Corrida de Rua. Enquanto isso, conheça os cursos da Phorte.">
    <meta name="theme-color" content="#07111d">
    <title>Meeting de Corrida de Rua | Novas datas em breve</title>
    <link rel="icon" href="assets/images/favicon.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="lp-event event--run">
      <div class="event-frame">
        <header class="event-header" aria-label="Meeting de Corrida de Rua">
          <a
            class="event-wordmark"
            href="#inicio"
            aria-label="Meeting de Corrida de Rua, início"
          >
            <span class="wordmark-kicker" aria-hidden="true">↗</span
            ><span class="wordmark-title"
              >MEETING <i>DE</i><br>CORRIDA DE RUA</span
            >
          </a>
          <span class="event-signature">ciência <b>×</b> performance</span>
        </header>
        <section class="event-hero" id="inicio" aria-labelledby="event-title">
          <div class="hero-copy">
            <p class="eyebrow">
              <span aria-hidden="true"></span> O próximo passo começa aqui
            </p>
            <h1 id="event-title">
              Em breve<br><span>divulgaremos<br>novas datas.</span>
            </h1>
            <p class="support-copy">
              Enquanto isso, confira nossos cursos de capacitação,
              aperfeiçoamento e extensão da Phorte e impulsione a sua carreira!
            </p>
            <a class="event-cta" href="https://phorte.com/"
              >Conheça os cursos da Phorte <span aria-hidden="true">↗</span></a
            >
          </div>
          <figure class="hero-visual">
            <img
              src="assets/images/corrida-performance.webp"
              alt="Atleta correndo em uma pista à beira-mar"
              width="720"
              height="900"
              fetchpriority="high">
            <figcaption>
              <span>MEETING DE CORRIDA DE RUA</span
              ><span class="caption-mark" aria-hidden="true">↗</span>
            </figcaption>
          </figure>
        </section>
        <footer class="event-footer">
          <span>Um projeto que segue em movimento.</span>
          <img class="phorte-logo" src="assets/images/phorte-logo.svg" alt="Faculdade Phorte" width="300" height="132">
        </footer>
      </div>
    </main>
  </body>
</html>
