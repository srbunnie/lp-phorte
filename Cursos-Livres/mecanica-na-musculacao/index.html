<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta
      name="description"
      content="Em breve divulgaremos novas datas para Mecânica na Musculação. Enquanto isso, conheça os cursos da Phorte.">
    <meta name="theme-color" content="#090909">
    <title>Mecânica na Musculação | Novas datas em breve</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="lp-event event--mechanics">
      <header class="event-header">
        <span class="header-rule" aria-hidden="true"></span
        ><span>FORMAÇÃO • TREINO • SEGURANÇA</span><span>PHORTE</span>
      </header>
      <section class="event-hero" aria-labelledby="event-title">
        <div class="hero-copy">
          <img
            class="event-logo"
            src="assets/images/logo-mecanica-musculacao.webp"
            alt="Mecânica da Musculação: técnicas de ajuda e segurança"
            width="300"
            height="134">
          <p class="eyebrow">CONHECIMENTO EM MOVIMENTO</p>
          <h1 id="event-title">
            <span class="headline-lead">Em breve</span> <span class="headline-main">divulgaremos<br>novas datas.</span>
          </h1>
          <p class="support-copy">
            Enquanto isso, confira nossos cursos de capacitação, aperfeiçoamento
            e extensão da Phorte e impulsione a sua carreira!
          </p>
          <a class="event-cta" href="https://phorte.com/"
            >Conheça os cursos da Phorte <span aria-hidden="true">↗</span></a
          >
        </div>
        <figure class="hero-visual">
          <img
            src="assets/images/mecanica-professores.webp"
            alt="Professores Francielli e Waldemar Guimarães"
            width="600"
            height="585">
          <figcaption>MECÂNICA NA MUSCULAÇÃO</figcaption>
        </figure>
      </section>
      <footer class="event-footer">
        <span>Uma nova edição está no horizonte.</span>
        <img class="phorte-logo" src="assets/images/phorte-logo.svg" alt="Faculdade Phorte" width="300" height="132">
        <span class="footer-emblem" aria-hidden="true">M</span>
      </footer>
    </main>
  </body>
</html>
